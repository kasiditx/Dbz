[package]
name = "dbz-tauri-poc"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt"] }
poc-workload = { path = "../../poc-workload" }
